<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./small-icon.svg">
  <title>Heroes of Mansken</title>

  <!-- Open Graph / Twitter Card — PLACEHOLDER URLs, edit the host to match your Pages URL. -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Heroes of Mansken">
  <meta property="og:description" content="A Tyranny of Dragons campaign">
  <meta property="og:image"        content="https://arekexora.github.io/ToD24/og.png">
  <meta property="og:image:width"  content="1300">
  <meta property="og:image:height" content="639">
  <meta property="og:image:type"   content="image/png">
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Heroes of Mansken">
  <meta name="twitter:description" content="A Tyranny of Dragons campaign">
  <meta name="twitter:image"       content="https://arekexora.github.io/ToD24/og.png">
  <style>
    :root {
      --bg: #f8f6f1;
      --fg: #2a2520;
      --dim: #86807a;
      --card-bg: #ffffff;
      --card-border: #e6e1d8;
      --accent: #7c3a2a;
      --accent-tint: #fff8f1;
      --full: #4a9d4a;
      --partial: #d6a53c;
      --empty: #c84a4a;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.05);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.4;
      height: 100vh;  /* fallback for older browsers */
      height: 100svh; /* smallest viewport — keeps the footer above any persistent browser chrome (Brave, etc.) */
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .wrap { max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 1rem; }

    /* Header */
    header {
      border-bottom: 1px solid var(--card-border);
      padding: 1.5rem 0 1.25rem;
      flex-shrink: 0;
      background: var(--bg);
    }
    header .wrap {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header .logo {
      height: 3rem;
      width: auto;
      flex-shrink: 0;
    }
    header .title {
      margin: 0 0 0.15rem;
      font-size: 1.6rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }
    header .subtitle {
      margin: 0;
      font-size: 0.9rem;
      color: var(--dim);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.02em;
    }
    /* Main (body) */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 0 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.7rem;
    }
    .loading, .error {
      padding: 2.5rem; text-align: center; color: var(--dim);
    }
    .error { color: var(--empty); }
    .error code { background: #eee; padding: .1rem .4rem; border-radius: 3px; }

    /* Session cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 0.75rem 0.9rem 0.8rem;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      position: relative;
      user-select: none;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .card .row {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      padding-right: 0.9rem; /* leave room for the dot */
    }
    .card .num {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .card .real {
      font-size: .82rem;
      font-variant-numeric: tabular-nums;
    }
    .card .fiction {
      font-size: .75rem;
      color: var(--dim);
      font-style: italic;
      margin-top: .25rem;
    }
    .card .dot, .legend i {
      border: 1px solid #b8862e;
      box-shadow:
        inset 0 -0.5px 1px rgba(0, 0, 0, 0.35),
        0 1px 1.5px rgba(0, 0, 0, 0.28);
    }
    .card .dot {
      position: absolute;
      top: 0.65rem; right: 0.75rem;
      width: 0.65rem; height: 0.65rem;
      border-radius: 50%;
    }
    .card .dot.full, .legend i.full {
      background: radial-gradient(circle at 30% 25%,
        #b4ecb4 0%,
        #4a9d4a 55%,
        #2e6a2e 100%);
    }
    .card .dot.partial, .legend i.partial {
      background: radial-gradient(circle at 30% 25%,
        #f7dc8a 0%,
        #d6a53c 55%,
        #9a7020 100%);
    }
    .card .dot.empty, .legend i.empty {
      background: radial-gradient(circle at 30% 25%,
        #f2a6a6 0%,
        #c84a4a 55%,
        #8a2a2a 100%);
    }
    .card .links {
      display: none;
      margin-top: .55rem; padding-top: .45rem;
      border-top: 1px solid var(--card-border);
      gap: 0.3rem;
    }
    .card.expanded .links { display: flex; }
    .card .links a, .card .links span {
      flex: 1 1 calc(50% - 0.15rem);
      text-align: center;
      font-size: .68rem;
      padding: .2rem .42rem;
      border-radius: 3px;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .card .links a {
      background: linear-gradient(to bottom,
        #9a4a37 0%,
        #7c3a2a 50%,
        #5e2a1e 100%);
      color: #fff6e2;
      border: 1px solid #c3993e;
      box-shadow:
        inset 0 1px 0 rgba(255, 230, 170, 0.15),
        inset 0 -1px 2px rgba(0, 0, 0, 0.25),
        0 1px 2px rgba(0, 0, 0, 0.18);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
      transition: box-shadow 0.12s ease, background 0.12s ease;
    }
    .card .links a:hover {
      background: linear-gradient(to bottom,
        #b25743 0%,
        #8e4433 50%,
        #6e3324 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 230, 170, 0.22),
        inset 0 -1px 2px rgba(0, 0, 0, 0.25),
        0 2px 4px rgba(0, 0, 0, 0.22);
    }
    .card .links span {
      background: #efede8;
      color: var(--dim);
      border: 1px solid #d4ccbe;
      cursor: not-allowed;
    }

    /* Compilation card — same behaviour as a session card, accent colouring for distinction. */
    .card.compilation {
      background: var(--accent-tint);
      border-color: var(--accent);
    }
    .card.compilation .num {
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .card.compilation.expanded .links {
      flex-wrap: wrap;
      border-top: none;
      padding-top: 0;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--card-border);
      padding: 0.9rem 0;
      font-size: 0.75rem;
      color: var(--dim);
      flex-shrink: 0;
      background: var(--bg);
    }
    footer .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .legend span { display: inline-flex; align-items: center; gap: .4rem; }
    .legend i {
      display: inline-block;
      width: .6rem; height: .6rem;
      border-radius: 50%;
    }
    #generated-at {
      font-variant-numeric: tabular-nums;
      margin-left: auto;
    }

    /* PDF viewer modal */
    .viewer-modal {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(20, 15, 10, 0.94);
      display: flex; flex-direction: column;
    }
    .viewer-modal[hidden] { display: none; }
    .viewer-header {
      background: #2a2520; color: #f8f6f1;
      padding: 0.55rem 0.9rem;
      display: flex; align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
      min-height: 2.4rem;
    }
    .viewer-nav, .viewer-actions {
      display: flex; gap: 0.35rem; align-items: center;
      flex-shrink: 0; flex-wrap: wrap;
    }
    .viewer-actions { margin-left: auto; }
    .viewer-actions a,
    .viewer-nav-btn {
      font-size: 0.72rem; color: #f8f6f1;
      text-decoration: none;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 0.25rem 0.55rem; border-radius: 3px;
      font-family: inherit; font-weight: 500;
      cursor: pointer; letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .viewer-actions a:hover,
    .viewer-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
    .viewer-nav-btn.arrow {
      padding: 0.2rem 0.5rem;
      min-width: 1.9rem;
      font-size: 0.9rem;
    }
    .viewer-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .viewer-close {
      background: transparent; border: none;
      color: #f8f6f1; font-size: 1.6rem;
      cursor: pointer; padding: 0 0.3rem; line-height: 1;
      font-family: inherit;
    }
    .viewer-body {
      flex: 1; overflow-y: auto;
      padding: 0.9rem 0.6rem;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.5rem;
    }
    .viewer-body canvas {
      max-width: 100%;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: block;
    }
    .viewer-body .status {
      color: #d6cfc5; text-align: center; padding: 2rem;
      font-size: 0.85rem;
    }
    .viewer-body .status.error { color: var(--empty); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <img src="./full-icon.svg" alt="" class="logo">
      <div class="titles">
        <h1 class="title">Heroes of Mansken</h1>
        <h3 class="subtitle">A Tyranny of Dragons campaign</h3>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="grid" id="grid">
        <div class="loading">Loading…</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="legend" id="legend">
        <span><i class="full"></i>All PDFs</span>
        <span><i class="partial"></i>Some</span>
        <span><i class="empty"></i>None</span>
      </div>
      <div id="generated-at"></div>
    </div>
  </footer>

  <div id="viewer-modal" class="viewer-modal" hidden aria-modal="true" role="dialog" aria-label="PDF viewer">
    <div class="viewer-header">
      <div class="viewer-nav">
        <button class="viewer-nav-btn arrow" id="viewer-prev" aria-label="Previous session, same file">←</button>
        <button class="viewer-nav-btn" id="viewer-kind-1" aria-label="Switch to other file"></button>
        <button class="viewer-nav-btn" id="viewer-kind-2" aria-label="Switch to other file"></button>
        <button class="viewer-nav-btn arrow" id="viewer-next" aria-label="Next session, same file">→</button>
      </div>
      <div class="viewer-actions">
        <a id="viewer-open-tab" target="_blank" rel="noopener noreferrer">Open in tab</a>
        <button class="viewer-close" id="viewer-close" aria-label="Close PDF">×</button>
      </div>
    </div>
    <div class="viewer-body" id="viewer-body"></div>
  </div>

  <script type="module">
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs';

  (async function () {
    const grid = document.getElementById('grid');
    const generatedAt = document.getElementById('generated-at');

    let data;
    try {
      const r = await fetch('./manifest.json', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
    } catch (e) {
      grid.innerHTML = `<div class="error">
        Could not load <code>manifest.json</code> (${escapeHtml(e.message)}).
        If testing locally, serve with <code>python3 -m http.server</code> rather than opening via <code>file://</code>.
      </div>`;
      return;
    }

    // Build grid: compilation card first, then per-session cards (descending order per manifest).
    const frag = document.createDocumentFragment();
    frag.appendChild(renderCompilationCard(data.campaign.pdfs));
    for (const s of data.sessions) frag.appendChild(renderSessionCard(s));
    grid.innerHTML = '';
    grid.appendChild(frag);

    // Footer date (manifest already carries it preformatted in DD/MM/YYYY)
    generatedAt.textContent = `Generated ${data.generated_at}`;

    // Card accordion — click to expand, click again (or click another card) to collapse.
    grid.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      const card = e.target.closest('.card');
      if (!card) return;
      const wasExpanded = card.classList.contains('expanded');
      grid.querySelectorAll('.card.expanded').forEach((c) => {
        c.classList.remove('expanded');
        c.setAttribute('aria-expanded', 'false');
      });
      if (!wasExpanded) {
        card.classList.add('expanded');
        card.setAttribute('aria-expanded', 'true');
      }
    });

    // PDF viewer modal
    const modal = document.getElementById('viewer-modal');
    const modalOpenTab = document.getElementById('viewer-open-tab');
    const modalBody = document.getElementById('viewer-body');
    const modalClose = document.getElementById('viewer-close');
    const navPrev = document.getElementById('viewer-prev');
    const navNext = document.getElementById('viewer-next');
    const navKind1 = document.getElementById('viewer-kind-1');
    const navKind2 = document.getElementById('viewer-kind-2');
    let pdfRenderToken = 0; // invalidates in-flight render if user closes / opens another
    let currentPdf = null;  // active PDFDocumentProxy — destroyed before switching / on close

    function kindLabel(k) { return k === 'gm' ? 'GM' : k.charAt(0).toUpperCase() + k.slice(1); }

    function updateNavButtons(ctx) {
      // ctx: { session: number|null, kind: 'saga'|'gm'|'minutes' }
      const otherKinds = ['minutes', 'gm', 'saga'].filter((k) => k !== ctx.kind);

      if (ctx.session == null) {
        // Compiled PDF — no prev/next session navigation; the two "other" buttons
        // hop between the campaign-wide PDFs.
        navPrev.hidden = true;
        navNext.hidden = true;
        [navKind1, navKind2].forEach((btn, i) => {
          const k = otherKinds[i];
          const lbl = kindLabel(k);
          btn.hidden = false;
          btn.textContent = lbl;
          btn.setAttribute('aria-label', `View ${lbl}`);
          btn.disabled = !data.campaign.pdfs[k];
          btn.onclick = () => openViewer({ session: null, kind: k });
        });
        return;
      }

      navPrev.hidden = false;
      navNext.hidden = false;

      // Sessions are in descending order in the manifest (latest first).
      // Previous session = lower session number = NEXT index. Next session = PREVIOUS index.
      const idx = data.sessions.findIndex((s) => s.n === ctx.session);
      const prevSession = idx >= 0 ? data.sessions[idx + 1] : null;
      const nextSession = idx > 0 ? data.sessions[idx - 1] : null;
      const current = idx >= 0 ? data.sessions[idx] : null;

      navPrev.disabled = !(prevSession && prevSession.pdfs[ctx.kind]);
      navPrev.onclick = () => {
        if (prevSession) openViewer({ session: prevSession.n, kind: ctx.kind });
      };

      navNext.disabled = !(nextSession && nextSession.pdfs[ctx.kind]);
      navNext.onclick = () => {
        if (nextSession) openViewer({ session: nextSession.n, kind: ctx.kind });
      };

      [navKind1, navKind2].forEach((btn, i) => {
        const k = otherKinds[i];
        const lbl = kindLabel(k);
        btn.hidden = false;
        btn.textContent = lbl;
        btn.setAttribute('aria-label', `View ${lbl}`);
        btn.disabled = !(current && current.pdfs[k]);
        btn.onclick = () => {
          if (current && current.pdfs[k]) openViewer({ session: current.n, kind: k });
        };
      });
    }

    async function openViewer(ctx) {
      // Resolve URL from context (session or compiled) via manifest.
      let url;
      if (ctx.session == null) {
        url = data.campaign.pdfs[ctx.kind];
      } else {
        const s = data.sessions.find((x) => x.n === ctx.session);
        if (!s) return;
        url = s.pdfs[ctx.kind];
      }
      if (!url) return;

      // Reflect current context in the URL hash so the page can be shared/reloaded here.
      const nextHash = ctxToHash(ctx);
      if (window.location.hash !== nextHash) {
        history.replaceState(null, '', nextHash);
      }

      const token = ++pdfRenderToken;
      // Release the previous PDF's memory (fonts, decoded images, structural trees)
      // before starting a new load — otherwise it accumulates across navigations.
      if (currentPdf) {
        currentPdf.destroy();
        currentPdf = null;
      }
      modalOpenTab.href = url;
      updateNavButtons(ctx);
      modalBody.innerHTML = '<div class="status">Loading PDF…</div>';
      modal.hidden = false;
      document.documentElement.style.overflow = 'hidden';

      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        if (token !== pdfRenderToken) {
          pdf.destroy();
          return;
        }
        currentPdf = pdf;
        modalBody.innerHTML = '';

        // Match canvas device pixels to the actual on-screen pixels: scale PDF so that
        // canvas.width (device pixels) == CSS display width × DPR. Then setting
        // canvas.style.width = canvas.width / dpr yields 1:1 device-pixel rendering = crisp.
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const bodyStyle = getComputedStyle(modalBody);
        const paddingX = parseFloat(bodyStyle.paddingLeft) + parseFloat(bodyStyle.paddingRight);
        // On mobile, use what we have; on desktop, cap so pages stay comfortably readable.
        const MAX_PAGE_WIDTH = 900;
        const cssWidth = Math.min(
          Math.max(240, modalBody.clientWidth - paddingX - 12 /* scrollbar buffer */),
          MAX_PAGE_WIDTH,
        );
        // Oversample the rasterisation so the browser's high-quality downsample sharpens edges & text.
        const SUPERSAMPLE = 2;

        const canvases = [];
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          if (token !== pdfRenderToken) return;
          const base = page.getViewport({ scale: 1 });
          const scale = (cssWidth / base.width) * dpr * SUPERSAMPLE;
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          canvas.style.width = cssWidth + 'px';
          canvas.style.height = (cssWidth * (viewport.height / viewport.width)) + 'px';
          canvas.dataset.pageN = String(n);
          modalBody.appendChild(canvas);
          canvases.push({ canvas, page, viewport });
        }

        // Lazy render as pages scroll into view.
        const observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting || entry.target.dataset.rendered) continue;
            const idx = parseInt(entry.target.dataset.pageN, 10) - 1;
            const { page, viewport } = canvases[idx];
            entry.target.dataset.rendered = '1';
            page.render({ canvasContext: entry.target.getContext('2d'), viewport });
            observer.unobserve(entry.target);
          }
        }, { root: modalBody, rootMargin: '400px 0px' });
        for (const { canvas } of canvases) observer.observe(canvas);
      } catch (e) {
        if (token !== pdfRenderToken) return;
        modalBody.innerHTML = `<div class="status error">Could not render PDF (${escapeHtml(e.message)}). Try <strong>Open in tab</strong> above.</div>`;
      }
    }

    function closeViewer() {
      pdfRenderToken++; // invalidate any in-flight renders
      if (currentPdf) {
        currentPdf.destroy();
        currentPdf = null;
      }
      modal.hidden = true;
      modalBody.innerHTML = '';
      document.documentElement.style.overflow = '';
      // Drop the deep-link hash so refreshing doesn't re-open the viewer.
      if (window.location.hash) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }

    modalClose.addEventListener('click', closeViewer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) closeViewer();
    });

    // Intercept PDF link clicks anywhere in the UI (but NOT links inside the modal itself,
    // so the "Open in tab" fallback actually opens a new tab).
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href]');
      if (!a || a.closest('#viewer-modal')) return;
      const href = a.getAttribute('href');
      if (!href || !/\.pdf($|\?|#)/i.test(href)) return;
      const kind = a.dataset.kind;
      if (!kind) return;
      e.preventDefault();
      const sessionAttr = a.dataset.session;
      const session = sessionAttr ? parseInt(sessionAttr, 10) : null;
      openViewer({ session: isNaN(session) ? null : session, kind });
    });

    // Deep-link via URL hash.
    //   #s23/gm     → session 23, GM
    //   #s01/saga   → session 1, Saga
    //   #c/minutes  → compilation, Minutes
    // Shared URL on cold load opens the viewer directly; manual hash edits & browser
    // Back/Forward (which both fire 'hashchange') open/close the viewer accordingly.
    window.addEventListener('hashchange', () => {
      const ctx = parseHash();
      if (ctx) openViewer(ctx);
      else if (!modal.hidden) closeViewer();
    });
    // Open the viewer on initial load if arrived with a valid hash.
    // Invalid/unknown hash → strip it so a refresh doesn't keep sending us here.
    const initialCtx = parseHash();
    if (initialCtx) {
      openViewer(initialCtx);
    } else if (window.location.hash) {
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    // --- helpers ---

    function ctxToHash(ctx) {
      if (ctx.session == null) return `#c/${ctx.kind}`;
      return `#s${String(ctx.session).padStart(2, '0')}/${ctx.kind}`;
    }

    function parseHash() {
      const raw = window.location.hash.slice(1);
      if (!raw) return null;
      const parts = raw.split('/');
      if (parts.length !== 2) return null;
      const [who, kind] = parts;
      if (!['saga', 'gm', 'minutes'].includes(kind)) return null;
      if (who === 'c' || who === 'compilation') return { session: null, kind };
      const m = /^s(\d+)$/i.exec(who);
      if (!m) return null;
      const n = parseInt(m[1], 10);
      if (!data.sessions.some((s) => s.n === n)) return null;
      return { session: n, kind };
    }

    function renderSessionCard(s) {
      const got = ['saga', 'gm', 'minutes'].filter((k) => s.pdfs[k]).length;
      const state = got === 3 ? 'full' : got === 0 ? 'empty' : 'partial';
      const stateLabel = state === 'full'
        ? 'Saga, GM, and Minutes available'
        : state === 'empty'
          ? 'No PDFs yet'
          : `${got}/3 PDFs available`;
      const card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('aria-expanded', 'false');
      const label = 'S' + String(s.n).padStart(2, '0');
      card.innerHTML = `
        <div class="dot ${state}" title="${stateLabel}" aria-label="${stateLabel}"></div>
        <div class="row">
          <span class="num">${label}</span>
          <span class="real">${escapeHtml(s.real_date || '—')}</span>
        </div>
        <div class="fiction">${escapeHtml(s.in_fiction_date || '—')}</div>
        <div class="links">
          ${linkOrSpan('Minutes', s.pdfs.minutes, s.n, 'minutes')}
          ${linkOrSpan('GM', s.pdfs.gm, s.n, 'gm')}
          ${linkOrSpan('Saga', s.pdfs.saga, s.n, 'saga')}
        </div>`;
      return card;
    }

    function renderCompilationCard(pdfs) {
      // Session-less compilation box pinned to top of the grid.
      // Four buttons: Saga / GM / Minutes (open the campaign-wide PDF) + Timeline (disabled for now).
      const card = document.createElement('div');
      card.className = 'card compilation';
      card.setAttribute('aria-expanded', 'false');
      card.innerHTML = `
        <div class="row">
          <span class="num">Campaign</span>
        </div>
        <div class="links">
          ${linkOrSpan('Minutes', pdfs.minutes, '', 'minutes')}
          ${linkOrSpan('GM', pdfs.gm, '', 'gm')}
          ${linkOrSpan('Saga', pdfs.saga, '', 'saga')}
          <span>Timeline</span>
        </div>`;
      return card;
    }

    function linkOrSpan(label, url, sessionN, kind) {
      return url
        ? `<a href="${encodeURI(url)}" target="_blank" rel="noopener noreferrer" data-session="${sessionN}" data-kind="${kind}">${label}</a>`
        : `<span>${label}</span>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
  })();
  </script>
</body>
</html>
