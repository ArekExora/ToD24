name: Regenerate manifest

on:
  push:
    branches: [main]
    paths:
      - 'sessions/**/*.pdf'
      - '.claude/skills/publish/generate_manifest.py'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate manifest.json
        run: python3 .claude/skills/publish/generate_manifest.py
      - name: Commit if changed
        run: |
          if git diff --quiet manifest.json; then
            echo "manifest.json unchanged, nothing to commit"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: regen manifest.json [skip ci]"
            git push
          fi
